<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0f172a" />
<title>SpeakCount — Chant Counter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
  .app { width: 100%; max-width: 640px; }
  h1 { text-align: center; margin: 16px 0; font-size: 1.6rem; }
  h1 span { color: #38bdf8; }

  .mic-section { text-align: center; margin: 18px 0; }
  #micBtn { width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    background: #334155; font-size: 2rem; transition: all 0.3s; }
  #micBtn.listening { background: #ef4444; animation: pulse 1.5s infinite; }
  #micBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
    70% { box-shadow: 0 0 0 25px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }
  #status { margin-top: 10px; color: #94a3b8; font-size: 0.9rem; min-height: 1.2em; }

  .lbl { font-size: 0.8rem; color: #94a3b8; display: block; margin: 14px 0 6px; }
  .app input:not([type=checkbox]), .app select { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #fff; font-size: 1rem; outline: none; }
  .app input:focus, .app select:focus { border-color: #38bdf8; }

  .chk { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px;
    font-size: 0.82rem; color: #94a3b8; cursor: pointer; }
  .chk input { margin-top: 2px; }

  .big-count { background: linear-gradient(135deg, #0ea5e9, #6366f1); border-radius: 16px;
    padding: 22px; text-align: center; margin: 20px 0; }
  .big-count .word { font-size: 1rem; opacity: 0.9; }
  .big-count .num { font-size: 4rem; font-weight: 800; }
  .big-count .num.pop { animation: pop 0.35s; }
  @keyframes pop { 50% { transform: scale(1.25); color: #fde68a; } }
  .big-count .live { min-height: 20px; font-size: 0.9rem; color: #fef9c3; }
  .big-count .live b { color: #fde68a; }

  .stats { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat { flex: 1; background: #1e293b; border-radius: 12px; padding: 14px; text-align: center; }
  .stat .val { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
  .stat .lb { font-size: 0.75rem; color: #94a3b8; }

  .transcript { background: #1e293b; border-radius: 12px; padding: 14px; min-height: 56px;
    font-size: 0.95rem; color: #cbd5e1; margin-bottom: 8px; }
  .transcript .interim { color: #64748b; font-style: italic; }

  #aliasLastBtn { width: 100%; margin: 0 0 14px; padding: 10px; border: 1px dashed #38bdf8;
    border-radius: 8px; background: transparent; color: #38bdf8; font-size: 0.85rem; cursor: pointer; }
  #aliasLastBtn:active { background: #1e293b; }

  .log { background: #1e293b; border-radius: 12px; padding: 10px 14px; max-height: 150px;
    overflow-y: auto; margin-bottom: 14px; font-size: 0.85rem; }
  .log div { padding: 5px 0; border-bottom: 1px solid #334155; }
  .log div:last-child { border: none; }
  .log .t { color: #64748b; float: right; }

  .freq-list { background: #1e293b; border-radius: 12px; padding: 12px 14px; max-height: 220px; overflow-y: auto; }
  .freq-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .freq-item .w { width: 100px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .freq-item .bar { flex: 1; height: 10px; background: #334155; border-radius: 5px; overflow: hidden; }
  .freq-item .fill { height: 100%; background: linear-gradient(90deg, #0ea5e9, #6366f1); transition: width 0.3s; }
  .freq-item .c { width: 36px; text-align: right; font-weight: 700; color: #38bdf8; }

  #resetBtn { width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 8px;
    background: #334155; color: #e2e8f0; font-size: 1rem; cursor: pointer; }
  .note { text-align: center; color: #64748b; font-size: 0.75rem; margin-top: 12px; }
</style>
</head>
<body>
<div class="app">
  <h1>🎤 Speak<span>Count</span></h1>

  <div class="mic-section">
    <button id="micBtn">🎤</button>
    <div id="status">Tap mic to start</div>
  </div>

  <label class="lbl">🗣️ Recognition language</label>
  <select id="langSelect">
    <option value="hi-IN" selected>Hindi (India) — best for mantras</option>
    <option value="en-IN">English (India)</option>
    <option value="en-US">English (US)</option>
  </select>

  <label class="lbl">🎯 Phrase to count</label>
  <input id="phraseInput" value="shree sita ram" />

  <label class="lbl">Also count these (comma separated)</label>
  <input id="aliasInput" placeholder="श्री सीता राम, shri sita ram, sita ram, sitaram" />

  <label class="chk">
    <input type="checkbox" id="fuzzyChk" checked />
    Flexible matching — forgive small mic errors (shri/shree, sita/seeta, ram/raam)
  </label>

  <div class="big-count">
    <div class="word">✅ Chants Completed</div>
    <div class="num" id="bigNum">0</div>
    <div class="live" id="liveHint"></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="val" id="totalWords">0</div><div class="lb">Total Words</div></div>
    <div class="stat"><div class="val" id="uniqueWords">0</div><div class="lb">Unique Words</div></div>
  </div>

  <div class="transcript" id="transcript">Your speech will appear here...</div>
  <button id="aliasLastBtn">➕ Mic hears it wrong? Tap to count the last line above as your chant</button>

  <div class="log" id="logList"></div>
  <div class="freq-list" id="freqList"></div>

  <button id="resetBtn">↺ Reset Counters</button>
  <div class="note">Counts auto-save on this device • Best in Chrome</div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const statusEl = $('status'), transcriptEl = $('transcript'), freqList = $('freqList');
const bigNum = $('bigNum'), liveHint = $('liveHint'), logList = $('logList');
const phraseInput = $('phraseInput'), aliasInput = $('aliasInput'), langSelect = $('langSelect');
const micBtn = $('micBtn'), resetBtn = $('resetBtn'), fuzzyChk = $('fuzzyChk'), aliasLastBtn = $('aliasLastBtn');

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

// ---------- state + persistence ----------
const STORAGE_KEY = 'speakcount-v2';
let counts = {}, total = 0, phraseHits = 0, logEntries = [];
let pending = [];
let lastHeard = '';

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      counts, total, phraseHits, logEntries,
      phrase: phraseInput.value, alias: aliasInput.value,
      lang: langSelect.value, fuzzy: fuzzyChk.checked
    }));
  } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!d) return;
    counts = d.counts || {}; total = d.total || 0;
    phraseHits = d.phraseHits || 0; logEntries = d.logEntries || [];
    if (d.phrase != null) phraseInput.value = d.phrase;
    if (d.alias != null) aliasInput.value = d.alias;
    if (d.lang) langSelect.value = d.lang;
    if (d.fuzzy != null) fuzzyChk.checked = d.fuzzy;
  } catch (e) {}
}
[phraseInput, aliasInput, langSelect, fuzzyChk].forEach(el =>
  el.addEventListener('input', () => { pending = []; save(); }));

// ---------- FIX #1: Hindi/Devanagari-safe normalization ----------
// ✅ Preserves ZWJ (‍), ZWNJ (‌), matras, and combining marks
const norm = s => {
  return s.toLowerCase()
    .normalize('NFC')
    .replace(/[^\p{L}\p{M}\p{N}\s‌‍']/gu, '')
    .replace(/\s+/g, ' ')
    .trim();
};

// ---------- FIX #5: Script transliteration helpers ----------
// ✅ Maps common Hindi/Roman variants so "राम" and "raam" both match
const TRANSLIT_MAP = [
  [/raam/g, 'ram'], [/ramaa/g, 'ram'], [/rām/g, 'ram'], [/राम/g, 'ram'],
  [/sitaa/g, 'sita'], [/seetaa/g, 'sita'], [/सीता/g, 'sita'], [/sītā/g, 'sita'],
  [/shree/g, 'shri'], [/sri/g, 'shri'], [/श्री/g, 'shri'], [/śrī/g, 'shri'],
  [/sitaram/g, 'sita ram'], [/sitaaram/g, 'sita ram'],
  [/hare/g, 'hare'], [/हरे/g, 'hare'],
  [/krishna/g, 'krishna'], [/krisna/g, 'krishna'], [/कृष्ण/g, 'krishna']
];
function scriptNormalize(s) {
  let out = s;
  for (const [re, val] of TRANSLIT_MAP) out = out.replace(re, val);
  return out;
}

// ---------- matching ----------
function lev(a, b) {
  const m = a.length, n = b.length;
  const d = [];
  for (let i = 0; i <= m; i++) d[i] = [i];
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1,
        d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}

// ---------- Full phrase normalization
function normalizeString(str) {
  return norm(scriptNormalize(str));
}

// ---------- matching the entire phrase ----------
function checkFullPhrase(heard, target) {
  const h = normalizeString(heard);
  const t = normalizeString(target);
  if (h === t) return true;
  if (!fuzzyChk.checked) return false;
  if (h.length < 3 || t.length < 3) return false;
  return lev(h, t) <= 2; // allow small differences
}

// ---------- main recognition handler ----------
recognition.onresult = (event) => {
  let interim = '';
  for (let i = event.resultIndex; i < event.results.length; i++) {
    const text = event.results[i][0].transcript;
    if (event.results[i].isFinal) {
      const finalText = normalizeString(text);
      const targetPhrase = normalizeString(phraseInput.value);
      
      // Check for full phrase match
      let isMatch = checkFullPhrase(finalText, targetPhrase);
      
      if (isMatch) {
        // Count as one complete chant
        phraseHits++;
        bigNum.textContent = phraseHits;
        bigNum.classList.remove('pop'); void bigNum.offsetWidth; bigNum.classList.add('pop');

        logEntries.unshift({ hits: 1, total: phraseHits, time: new Date().toLocaleTimeString() });
        if (logEntries.length > 50) logEntries.length = 50;
        renderLog();
      }

      // Show recognized text
      transcriptEl.textContent = '“' + text.trim() + '”';
      liveHint.innerHTML = liveProgress();
    } else {
      interim += text;
    }
  }
  if (interim) {
    transcriptEl.textContent = '“' + interim.trim() + '” ';
    const dots = document.createElement('span');
    dots.className = 'interim'; dots.textContent = '…';
    transcriptEl.appendChild(dots);
    liveHint.innerHTML = liveProgress(norm(interim).split(' ').filter(Boolean));
  }
  render();
};

// ... rest of your code remains unchanged ...

// No other changes needed
</script>
</body>
</html>
