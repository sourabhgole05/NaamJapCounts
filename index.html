<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakCount — Phrase Counter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
  .app { width: 100%; max-width: 640px; }
  h1 { text-align: center; margin: 16px 0; font-size: 1.6rem; }
  h1 span { color: #38bdf8; }

  .mic-section { text-align: center; margin: 18px 0; }
  #micBtn { width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    background: #334155; font-size: 2rem; transition: all 0.3s; }
  #micBtn.listening { background: #ef4444; animation: pulse 1.5s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
    70% { box-shadow: 0 0 0 25px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }
  #status { margin-top: 10px; color: #94a3b8; font-size: 0.9rem; }

  .lbl { font-size: 0.8rem; color: #94a3b8; display: block; margin: 14px 0 6px; }
  .app input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #fff; font-size: 1rem; outline: none; }
  .app input:focus { border-color: #38bdf8; }

  .big-count { background: linear-gradient(135deg, #0ea5e9, #6366f1); border-radius: 16px;
    padding: 22px; text-align: center; margin: 20px 0; }
  .big-count .word { font-size: 1rem; opacity: 0.9; }
  .big-count .num { font-size: 4rem; font-weight: 800; }
  .big-count .num.pop { animation: pop 0.35s; }
  @keyframes pop { 50% { transform: scale(1.25); color: #fde68a; } }
  .big-count .live { min-height: 20px; font-size: 0.85rem; color: #fef9c3; }

  .stats { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat { flex: 1; background: #1e293b; border-radius: 12px; padding: 14px; text-align: center; }
  .stat .val { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
  .stat .lb { font-size: 0.75rem; color: #94a3b8; }

  .transcript { background: #1e293b; border-radius: 12px; padding: 14px; min-height: 56px;
    font-size: 0.95rem; color: #cbd5e1; margin-bottom: 14px; }
  .transcript .interim { color: #64748b; font-style: italic; }

  .log { background: #1e293b; border-radius: 12px; padding: 10px 14px; max-height: 150px;
    overflow-y: auto; margin-bottom: 14px; font-size: 0.85rem; }
  .log div { padding: 5px 0; border-bottom: 1px solid #334155; }
  .log div:last-child { border: none; }
  .log .t { color: #64748b; float: right; }

  .freq-list { background: #1e293b; border-radius: 12px; padding: 12px 14px; max-height: 220px; overflow-y: auto; }
  .freq-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .freq-item .w { width: 100px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .freq-item .bar { flex: 1; height: 10px; background: #334155; border-radius: 5px; overflow: hidden; }
  .freq-item .fill { height: 100%; background: linear-gradient(90deg, #0ea5e9, #6366f1); transition: width 0.3s; }
  .freq-item .c { width: 36px; text-align: right; font-weight: 700; color: #38bdf8; }

  #resetBtn { width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 8px;
    background: #334155; color: #e2e8f0; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <h1>🎤 Speak<span>Count</span></h1>

  <div class="mic-section">
    <button id="micBtn">🎤</button>
    <div id="status">Tap mic to start</div>
  </div>

  <label class="lbl">🎯 Phrase to count</label>
  <input id="phraseInput" value="shree sita ram">

  <label class="lbl">Also count these (comma separated) — in case mic hears it differently</label>
  <input id="aliasInput" placeholder="shri sita ram, sita ram, shree sitaram">

  <div class="big-count">
    <div class="word">✅ Phrases Completed</div>
    <div class="num" id="bigNum">0</div>
    <div class="live" id="liveHint"></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="val" id="totalWords">0</div><div class="lb">Total Words</div></div>
    <div class="stat"><div class="val" id="uniqueWords">0</div><div class="lb">Unique Words</div></div>
  </div>

  <div class="transcript" id="transcript">Your speech will appear here...</div>
  <div class="log" id="logList"></div>
  <div class="freq-list" id="freqList"></div>

  <button id="resetBtn">↺ Reset Counters</button>
</div>

<script>
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const statusEl = document.getElementById('status');
  const transcriptEl = document.getElementById('transcript');
  const freqList = document.getElementById('freqList');
  const bigNum = document.getElementById('bigNum');
  const liveHint = document.getElementById('liveHint');
  const logList = document.getElementById('logList');
  const phraseInput = document.getElementById('phraseInput');
  const aliasInput = document.getElementById('aliasInput');
  const micBtn = document.getElementById('micBtn');

  if (!window.isSecureContext) {
    statusEl.innerHTML = '🔒 Mic blocked! Open via <b>https://</b> link — not from file manager.';
  }
  if (!SR) {
    statusEl.textContent = '❌ Not supported. Use Chrome.';
    micBtn.disabled = true;
  }

  const recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-IN';   // better for Indian names; try 'hi-IN' too

  let shouldListen = false;
  let counts = {}, total = 0, phraseHits = 0;

  const norm = s => s.toLowerCase().replace(/[^\w\s']/g, '').replace(/\s+/g, ' ').trim();

  // All phrases that count (main + aliases)
  function getPhrases() {
    const list = [phraseInput.value, ...aliasInput.value.split(',')];
    return list.map(norm).filter(Boolean).map(p => p.split(' '));
  }

  // Count completed phrase occurrences in spoken text (non-overlapping)
  function countPhrases(text) {
    const words = norm(text).split(' ').filter(Boolean);
    const phrases = getPhrases();
    let hits = 0;
    for (let i = 0; i < words.length; i++) {
      for (const pw of phrases) {
        if (pw.every((w, j) => words[i + j] === w)) {
          hits++;
          i += pw.length - 1;   // skip past matched phrase
          break;
        }
      }
    }
    return hits;
  }

  micBtn.addEventListener('click', () => {
    shouldListen = !shouldListen;
    if (shouldListen) {
      try { recognition.start(); } catch(e) {}
    } else {
      recognition.stop();
    }
  });

  recognition.onstart = () => {
    micBtn.classList.add('listening');
    statusEl.textContent = '🔴 Listening... say the phrase!';
  };

  // Auto-restart so you don't have to keep tapping
  recognition.onend = () => {
    if (shouldListen) {
      try { recognition.start(); } catch(e) {}
    } else {
      micBtn.classList.remove('listening');
      statusEl.textContent = 'Tap mic to start';
    }
  };

  recognition.onerror = (e) => {
    statusEl.textContent = '⚠️ Error: ' + e.error;
    if (e.error === 'not-allowed') shouldListen = false;
  };

  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const text = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        // count all words
        norm(text).split(' ').filter(Boolean).forEach(w => {
          counts[w] = (counts[w] || 0) + 1; total++;
        });
        // count completed phrases
        const hits = countPhrases(text);
        if (hits > 0) {
          phraseHits += hits;
          bigNum.textContent = phraseHits;
          bigNum.classList.remove('pop'); void bigNum.offsetWidth; bigNum.classList.add('pop');
          const time = new Date().toLocaleTimeString();
          logList.insertAdjacentHTML('afterbegin',
            `<div>✅ Phrase completed ${hits > 1 ? '×' + hits : ''} — total <b>#${phraseHits}</b><span class="t">${time}</span></div>`);
        }
        liveHint.textContent = '';
        transcriptEl.textContent = '“' + text.trim() + '”';
      } else {
        interim += text;
      }
    }
    // live preview while you're mid-phrase
    if (interim) {
      const live = countPhrases(interim);
      liveHint.textContent = live > 0 ? '👂 Heard it! finishing...' : '';
      transcriptEl.innerHTML = '“' + interim.trim() + '” <span class="interim">…</span>';
    }
    render();
  };

  function render() {
    document.getElementById('totalWords').textContent = total;
    document.getElementById('uniqueWords').textContent = Object.keys(counts).length;
    const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 15);
    const max = sorted.length ? sorted[0][1] : 1;
    freqList.innerHTML = sorted.map(([w,c]) => `
      <div class="freq-item">
        <div class="w">${w}</div>
        <div class="bar"><div class="fill" style="width:${(c/max)*100}%"></div></div>
        <div class="c">${c}</div>
      </div>`).join('');
  }

  document.getElementById('resetBtn').addEventListener('click', () => {
    counts = {}; total = 0; phraseHits = 0;
    bigNum.textContent = '0'; logList.innerHTML = ''; freqList.innerHTML = '';
    transcriptEl.textContent = 'Your speech will appear here...';
    render();
  });
</script>
</body>
</html>
