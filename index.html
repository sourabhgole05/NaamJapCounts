<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SpeakCount - Fixed Version</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
  .app { width: 100%; max-width: 640px; }
  h1 { text-align: center; margin: 16px 0; font-size: 1.6rem; }
  h1 span { color: #38bdf8; }

  .mic-section { text-align: center; margin: 18px 0; }
  #micBtn { width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    background: #334155; font-size: 2rem; transition: all 0.3s; }
  #micBtn.listening { background: #ef4444; animation: pulse 1.5s infinite; }
  #micBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
    70% { box-shadow: 0 0 0 25px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }
  #status { margin-top: 10px; color: #94a3b8; font-size: 0.9rem; min-height: 1.2em; }
  #transcript { margin-top: 16px; font-size: 1rem; min-height: 2em; }
  #countDisplay { margin-top: 16px; font-size: 1.2rem; font-weight: bold; }

</style>
</head>
<body>
<div class="app">
  <h1>🎤 Speak<span>Count</span></h1>
  <div class="mic-section">
    <button id="micBtn">🎤</button>
    <div id="status">Tap mic to start</div>
  </div>
  <div id="transcript">Your speech will appear here...</div>
  <div id="countDisplay">Count: 0</div>
</div>

<script>
const recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const countEl = document.getElementById('countDisplay');

let recognitionActive = false;
let phraseCount = 0;

const targetPhrase = "shree sita ram"; // Set your phrase here

// Setup recognition
const recog = new recognition();
recog.continuous = true;
recog.interimResults = true;
recog.lang = 'hi-IN'; // Use Hindi or your preferred language

recog.onstart = () => {
  recognitionActive = true;
  statusEl.textContent = 'Listening...';
  micBtn.textContent = '🛑'; // change button to indicate stop
  micBtn.classList.add('listening');
};

recog.onend = () => {
  recognitionActive = false;
  statusEl.textContent = 'Stopped. Tap to start.';
  micBtn.textContent = '🎤';
  micBtn.classList.remove('listening');
};

recog.onresult = (event) => {
  let finalTranscript = '';
  for (let i = event.resultIndex; i < event.results.length; i++) {
    const transcript = event.results[i][0].transcript;
    if (event.results[i].isFinal) {
      finalTranscript += transcript + ' ';
    }
  }
  // Show interim or final transcript
  transcriptEl.textContent = finalTranscript;

  // Check if the final transcript contains the phrase
  const normalize = str => str.toLowerCase().normalize('NFC').replace(/[^\p{L}\p{M}\p{N}\s‌‍']/gu, '').trim();
  const normalizedTranscript = normalize(finalTranscript);
  const normalizedTarget = normalize(targetPhrase);

  if (normalizedTranscript.includes(normalizedTarget)) {
    phraseCount++;
    countEl.textContent = 'Count: ' + phraseCount;
  }
};

// Toggle recognition on button click
micBtn.onclick = () => {
  if (recognitionActive) {
    recog.stop();
  } else {
    recog.start();
  }
};
</script>
</body>
</html>
